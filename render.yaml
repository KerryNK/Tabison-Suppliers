services:
  - type: web
    name: tabison-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: |
      npm install &&
      cd ../frontend &&
      npm install &&
      npm run build &&
      cp -r dist ../backend/public
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - fromGroup: mongodb

# If you're using MongoDB, add this:
envVarGroups:
  - name: mongodb
    envVars:
      - key: MONGODB_URI
        sync: false